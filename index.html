<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Sneaker Box BBQ - المنيو الرقمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <h1>The Sneaker Box BBQ 🍔</h1>
            <p>أصلي، طازج، ومدخن بشغف</p>
        </div>
    </header>

    <!-- Announcement Banner -->
    <div id="announcement-banner" class="announcement-banner hidden">
        <div class="marquee"><span id="announcement-text"></span></div>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>جاري تحميل أشهى الأطباق...</p>
    </div>

    <!-- Category Navigation -->
    <nav id="category-nav" class="category-nav"></nav>

    <!-- Main Content -->
    <main id="menu-container">
        <!-- سيتم حقن الأقسام والأصناف هنا بواسطة JavaScript -->
    </main>

    <!-- Floating Cart Button -->
    <button id="cart-fab" class="cart-fab hidden">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count">0</span>
    </button>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>سلة الطلبات 🛒</h2>
                <button id="close-cart" class="close-btn">&times;</button>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- سيتم حقن الأصناف المطلوبة هنا -->
            </div>
            <div class="cart-summary">
                <div class="cart-total">الإجمالي: <span id="cart-total-price">0.00</span> ج.م</div>
                
                <div class="order-form">
                    <input type="text" id="customer-name" placeholder="رقم الطاولة أو اسم العميل *" required />
                    <input type="tel" id="customer-phone" placeholder="رقم الموبايل *" required />
                    <textarea id="order-notes" placeholder="ملاحظات إضافية (مثال: بدون صوص)..." rows="2"></textarea>
                </div>
                
                <button id="checkout-btn" class="checkout-btn">تأكيد وإرسال الطلب</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal hidden">
        <div class="modal-content text-center">
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">✅</h1>
            <h2>تم إرسال طلبك بنجاح!</h2>
            <p style="margin-top: 1rem; color: #64748b;">جاري تحضير طلبك، شكراً لاختيارك The Sneaker Box BBQ.</p>
            <button id="close-success" class="checkout-btn" style="margin-top: 1.5rem;">حسناً</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">تم إضافة الصنف للسلة</div>

    <!-- Social Media Footer -->
    <footer id="social-footer" class="social-footer hidden">
        <p class="footer-title">تابعنا لمعرفة أحدث العروض!</p>
        <div class="social-icons">
            <a id="link-facebook" href="#" target="_blank" class="social-icon hidden" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a id="link-instagram" href="#" target="_blank" class="social-icon hidden" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a id="link-tiktok" href="#" target="_blank" class="social-icon hidden" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a id="link-whatsapp" href="#" target="_blank" class="social-icon hidden" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            <a id="link-googlemaps" href="#" target="_blank" class="social-icon hidden" title="Google Maps"><i class="fa-solid fa-map-location-dot"></i></a>
        </div>
    </footer>

    <!-- Firebase SDK (Not needed, using Fetch) -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
