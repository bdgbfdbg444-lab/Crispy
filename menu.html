<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SNEAKER BOX BBQ - المنيو</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    
    <!-- CSS Split -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" media="(min-width: 992px)" href="desktop.css">
    <link rel="stylesheet" media="(max-width: 991px)" href="mobile.css">
    
    <style>
        /* Specific Menu Overrides for Brutalist Vibe */
        .category-title {
            font-size: 3rem;
            font-weight: 900;
            margin: 4rem 0 2rem 0;
            text-transform: uppercase;
            color: var(--primary-color);
            border-bottom: 2px solid rgba(255, 51, 0, 0.2);
            padding-bottom: 1rem;
        }
        
        .product-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .product-card p {
            color: var(--text-muted);
            font-size: 1rem;
            flex-grow: 1;
        }
        .product-card .price {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-color);
        }
        
        .add-to-cart-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            width: 100%;
        }
        .add-to-cart-btn:hover {
            background: var(--primary-color);
            color: #fff;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: var(--surface-color);
            padding: 3rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .weight-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .weight-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body id="menu-page">
    <div id="toast" class="toast hidden">تم إضافة الصنف للسلة</div>
    
    <!-- Top Navbar -->
    <nav class="top-navbar">
        <a href="index.html" class="nav-logo">
            <i class="fa-solid fa-fire"></i> THE SNEAKER BOX
        </a>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="menu.html">المنيو</a>
        </div>
        <div class="nav-actions">
            <div class="cart-trigger" style="position:relative; font-size:1.5rem;">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge cart-count" style="display:none; position:absolute; top:-10px; right:-10px; background:var(--primary-color); padding:2px 6px; border-radius:10px; font-size:12px; font-weight:bold;">0</span>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 120px;">
        <h1 class="text-massive" style="text-align: right; margin-bottom: 2rem;">
            اكتشف <span class="highlight">المنيو</span>
        </h1>
        
        <div id="loader" class="loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل...
        </div>
        
        <div id="menu-container" style="display: none;">
            <!-- Rendered by app-core.js -->
        </div>
    </div>

    <!-- Weight Selection Modal -->
    <div id="weight-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="weight-item-name" style="font-size: 2rem; margin-bottom: 1rem;"></h2>
            <p style="color: var(--text-muted);">حدد الوزن المطلوب بالجرام (أقل كمية 100 جم)</p>
            
            <div class="weight-controls">
                <button class="weight-btn" id="btn-minus-weight">-</button>
                <div style="font-size: 3rem; font-weight: 900;" id="weight-display">100<span style="font-size:1.5rem;">g</span></div>
                <button class="weight-btn" id="btn-plus-weight">+</button>
            </div>
            
            <p style="font-size: 1.5rem; margin-bottom: 2rem;">الإجمالي: <span id="weight-total-price" style="color: var(--primary-color); font-weight:900;">0</span> جنيه</p>
            
            <div style="display: flex; gap: 1rem;">
                <button id="cancel-weight-btn" class="btn-primary" style="flex:1; background:#333;">إلغاء</button>
                <button id="confirm-weight-btn" class="btn-primary" style="flex:2;">إضافة للسلة</button>
            </div>
        </div>
    </div>
    
    <!-- Addons Modal (If used in POS) -->
    <div id="addons-modal" class="modal hidden">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
            <h2 style="font-size: 2rem; margin-bottom: 1rem;">الإضافات</h2>
            <div id="addons-container" style="text-align: right; margin-bottom: 2rem;"></div>
            <button id="confirm-addons-btn" class="btn-primary" style="width: 100%;">تأكيد وإضافة للسلة</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content" style="text-align: right;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 style="font-size: 2rem;">السلة</h2>
                <button id="close-cart" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cart-items" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; max-height: 50vh; overflow-y: auto;">
                <!-- Items injected here -->
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                <input type="text" id="customer-name" placeholder="الاسم الكريم" style="padding: 1rem; border-radius: var(--radius-sm); border: none; background: #2A2A2A; color: white; width: 100%;" />
                <input type="tel" id="customer-phone" placeholder="رقم الهاتف" style="padding: 1rem; border-radius: var(--radius-sm); border: none; background: #2A2A2A; color: white; width: 100%;" />
                <textarea id="order-notes" placeholder="ملاحظات إضافية (اختياري)" rows="2" style="padding: 1rem; border-radius: var(--radius-sm); border: none; background: #2A2A2A; color: white; width: 100%;"></textarea>
            </div>

            <div style="font-size: 1.5rem; font-weight: 900; margin-bottom: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                الإجمالي: <span id="cart-total-price" style="color: var(--primary-color);">0</span> جنيه
            </div>
            <button id="checkout-btn" class="btn-primary" style="width: 100%;">تأكيد وإرسال الطلب</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>
        <a href="menu.html" class="bottom-nav-item active">
            <i class="fa-solid fa-utensils"></i>
            <span>المنيو</span>
        </a>
        <a href="javascript:void(0)" class="bottom-nav-item cart-trigger">
            <div style="position: relative;">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge cart-count">0</span>
            </div>
            <span>السلة</span>
        </a>
    </nav>

    <footer style="text-align: center; padding: 3rem; margin-top: 5rem; border-top: 1px solid rgba(255,255,255,0.05); color: var(--text-muted);">
        <p>© 2026 The Sneaker Box BBQ. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- GSAP & Lenis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    
    <!-- Swiper -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- Custom Logic -->
    <script src="config.js"></script>
    <script src="desktop-interactions.js"></script>
    <script src="mobile-interactions.js"></script>
    <script src="app-core.js"></script>
</body>
</html>
